services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devicemonitor
      POSTGRES_USER: devicemonitor
      POSTGRES_PASSWORD: devicemonitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devicemonitor"]
      interval: 5s
      retries: 10

  web:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=devicemonitor;Username=devicemonitor;Password=devicemonitor
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
